services:
  sovereign-ai:
    build: .
    environment:
      SOVEREIGN_DATA_DIR: /app/data
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL:-http://host.docker.internal:1234/v1}
      LOCAL_MODEL: ${LOCAL_MODEL:-local-model}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - sovereign_data:/app/data
volumes:
  sovereign_data:
