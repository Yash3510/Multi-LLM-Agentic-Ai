# The uv workspace root. It is not a package: every package lives under core/ or apps/
# and declares its own dependencies. Shared tool settings live here.

[project]
name = "fource-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core/*", "apps/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["fource"]

[tool.pyright]
pythonVersion = "3.12"
include = ["core", "apps", "tools"]
strict = ["core", "apps"]
extraPaths = ["tools"]

[tool.importlinter]
root_packages = ["fource"]

[[tool.importlinter.contracts]]
name = "common depends on no other 4CE package"
type = "forbidden"
source_modules = ["fource.common"]
forbidden_modules = ["fource.*"]

[[tool.importlinter.contracts]]
name = "Only the public API of fource.common is imported from outside it"
type = "protected"
protected_modules = ["fource.common.*"]
allowed_importers = ["fource.common"]

[tool.pytest.ini_options]
# Every package has a tests/ folder, so test file names repeat across packages.
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["core", "apps", "tools"]
pythonpath = ["tools"]
markers = ["postgres: needs PostgreSQL 18; run with just test-postgres after just services"]

[[tool.importlinter.contracts]]
name = "Only the public API of fource.packs is imported from outside it"
type = "protected"
protected_modules = ["fource.packs.*"]
allowed_importers = ["fource.packs"]

[[tool.importlinter.contracts]]
name = "Only the public API of fource.db is imported from outside it"
type = "protected"
protected_modules = ["fource.db.*"]
allowed_importers = ["fource.db"]

[[tool.importlinter.contracts]]
name = "The server sits above the core packages; core never imports it"
type = "layers"
layers = ["fource.server", "fource.identity", "fource.db", "fource.common"]

[[tool.importlinter.contracts]]
name = "Only the public API of fource.identity is imported from outside it"
type = "protected"
protected_modules = ["fource.identity.*"]
allowed_importers = ["fource.identity"]
