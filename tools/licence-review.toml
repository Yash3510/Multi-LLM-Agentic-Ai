# Packages whose metadata doesn't name an SPDX licence (often just "BSD License").
# A person read each one's LICENSE file and recorded the licence it actually grants.
# The version is pinned, so an update is read again before the gate passes it.
# R4 reviews every change to this file.

[[package]]
name = "grimp"
version = "3.17"
licence = "BSD-2-Clause"
checked = "LICENSE file in the wheel's dist-info, 2026-10-12"

[[package]]
name = "import-linter"
version = "2.15"
licence = "BSD-2-Clause"
checked = "LICENSE file in the wheel's dist-info, 2026-10-12"

[[package]]
name = "nodeenv"
version = "1.11.0"
licence = "BSD-3-Clause"
checked = "LICENSE file in the wheel's dist-info, 2026-10-12 (three clauses, incl. no endorsement)"

[[package]]
name = "colorama"
version = "0.4.6"
licence = "BSD-3-Clause"
checked = "LICENSE.txt at tag 0.4.6 (commit 3de9f013), 2026-10-12; installed on Windows only"

[[package]]
name = "uvloop"
version = "0.23.0"
licence = "MIT OR Apache-2.0"
checked = "LICENSE-MIT and LICENSE-APACHE (Apache 2.0 text) in the wheel's dist-info, 2026-10-17; dual-licensed; installed on Linux and macOS only"

[[package]]
name = "httpx"
version = "0.28.1"
licence = "BSD-3-Clause"
checked = "LICENSE.md in the wheel's dist-info, 2026-10-17 (three clauses, incl. no endorsement); metadata names BSD-3-Clause and again the classifier 'BSD License', which the gate can't match"

[[package]]
name = "certifi"
version = "2026.7.22"
licence = "MPL-2.0"
checked = "LICENSE in the wheel's dist-info, 2026-10-17 (the MPL 2.0 notice for the CA bundle); metadata names MPL-2.0 as an SPDX id and again as a classifier text the gate can't match, and the ADR-0037 approval below needs a single value"

# Review-required licences approved by an ADR. Each passes only for this package and only
# while its licence stays exactly as written; any other package with the licence still fails.

[[approved]]
name = "psycopg"
licence = "LGPL-3.0-only"
adr = "ADR-0037"

[[approved]]
name = "psycopg-binary"
licence = "LGPL-3.0-only"
adr = "ADR-0037"

[[approved]]
name = "certifi"
licence = "MPL-2.0"
adr = "ADR-0037"

[[approved]]
name = "cffi"
licence = "MIT-0"
adr = "ADR-0037"
