# Packages whose metadata doesn't name an SPDX licence (often just "BSD License").
# A person read each one's LICENSE file and recorded the licence it actually grants.
# The version is pinned, so an update is read again before the gate passes it.
# R4 reviews every change to this file.

[[package]]
name = "grimp"
version = "3.17"
licence = "BSD-2-Clause"
checked = "LICENSE file in the wheel's dist-info, 2026-10-12"

[[package]]
name = "import-linter"
version = "2.15"
licence = "BSD-2-Clause"
checked = "LICENSE file in the wheel's dist-info, 2026-10-12"

[[package]]
name = "nodeenv"
version = "1.11.0"
licence = "BSD-3-Clause"
checked = "LICENSE file in the wheel's dist-info, 2026-10-12 (three clauses, incl. no endorsement)"

[[package]]
name = "colorama"
version = "0.4.6"
licence = "BSD-3-Clause"
checked = "LICENSE.txt at tag 0.4.6 (commit 3de9f013), 2026-10-12; installed on Windows only"

# Review-required licences approved by an ADR. Each passes only for this package and only
# while its licence stays exactly as written; any other package with the licence still fails.

[[approved]]
name = "psycopg"
licence = "LGPL-3.0-only"
adr = "ADR-0037"

[[approved]]
name = "psycopg-binary"
licence = "LGPL-3.0-only"
adr = "ADR-0037"

[[approved]]
name = "certifi"
licence = "MPL-2.0"
adr = "ADR-0037"

[[approved]]
name = "cffi"
licence = "MIT-0"
adr = "ADR-0037"
