# The fast checks, before every commit. `just check` runs the full set.
# Local hooks run through uv, so they use the versions pinned in uv.lock.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # The same scanner over the branch's whole history, for `just secrets` and CI.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the branch's history
        entry: gitleaks git --redact --verbose --log-opts=HEAD
        stages: [manual]
        always_run: true # it scans history, so it must run even with nothing staged

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: repo-check
        name: repo check
        entry: uv run python tools/repo_check.py
        language: system
        pass_filenames: false
      - id: neutrality
        name: neutrality check
        entry: uv run python tools/neutrality_check.py
        language: system
        pass_filenames: false
      - id: docs
        name: docs check
        entry: uv run python tools/docs_check.py
        language: system
        pass_filenames: false
      - id: commit-message
        name: Conventional Commit message
        entry: uv run python tools/repo_check.py --commit-msg
        language: system
        stages: [commit-msg]
