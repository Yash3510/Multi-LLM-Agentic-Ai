name: CI

on:
  pull_request:
  push:
    branches: [4ce-core]

permissions:
  contents: read

jobs:
  check:
    name: just check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets scan and the PR rules read the history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv tool install rust-just
      - run: just setup
      - run: just check

  pull-request:
    name: pull request rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Commits and the PR title are Conventional Commits, none empty
        env:
          BASE: origin/${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          uv run python tools/repo_check.py --commits "$BASE..HEAD"
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          uv run python tools/repo_check.py --commit-msg "$RUNNER_TEMP/title"
      - name: One work-log entry, no docs drift, accepted ADRs unchanged
        env:
          BASE: origin/${{ github.base_ref }}
          DRIFT: ${{ contains(github.event.pull_request.labels.*.name, 'docs-unaffected') && '--allow-drift' || '' }}
        run: uv run python tools/docs_check.py --base "$BASE" $DRIFT
