name: CI

on:
  pull_request:
    # edited and (un)labeled re-run the PR rules when the title or docs-unaffected changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [4ce-core]

permissions:
  contents: read

jobs:
  check:
    name: just check (${{ matrix.os }})
    # The code is unchanged by a title or label edit, so the matrix runs only for code.
    if: github.event_name == 'push' || contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets scan and the PR rules read the history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv tool install rust-just==1.58.0
      # The web app needs Node 24 (apps/web/package.json engines; ADR-0035).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The web app's browser tests (just web-e2e, part of just check) need Playwright's Chromium.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: just setup
      - run: npm --prefix apps/web exec -- playwright install chromium
      - if: runner.os == 'Linux'
        run: npm --prefix apps/web exec -- playwright install-deps chromium
      - run: just check

  postgres:
    name: PostgreSQL tests
    if: github.event_name == 'push' || contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: fource
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: fource
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fource -d fource"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway values for a database that lives for one job.
      FOURCE_POSTGRES_PASSWORD: ci-owner-password
      FOURCE_POSTGRES_APP_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv tool install rust-just==1.58.0
      - run: uv sync --all-packages --locked
      - run: just test-postgres

  redis:
    name: Redis tests
    if: github.event_name == 'push' || contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # A throwaway server that lives for one job; the tests read only this variable.
      FOURCE_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv tool install rust-just==1.58.0
      - run: uv sync --all-packages --locked
      - run: just test-redis

  minio:
    name: MinIO tests
    if: github.event_name == 'push' || contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    env:
      # A throwaway server that lives for one job; the tests read only these variables.
      FOURCE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      FOURCE_TEST_S3_ACCESS_KEY: ci-minio-user
      FOURCE_TEST_S3_SECRET_KEY: ci-minio-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same image compose uses: the last MinIO release, built unmodified from its tag.
      - run: docker build -t fource/minio:RELEASE.2025-10-15T17-29-55Z -f deploy/config/minio/minio.dockerfile deploy/config/minio
      - run: >-
          docker run -d --name fource-test-minio -p 127.0.0.1:9000:9000
          -e MINIO_ROOT_USER="$FOURCE_TEST_S3_ACCESS_KEY"
          -e MINIO_ROOT_PASSWORD="$FOURCE_TEST_S3_SECRET_KEY"
          -e MINIO_UPDATE=off -e MINIO_CALLHOME_ENABLE=off
          fource/minio:RELEASE.2025-10-15T17-29-55Z server /data
      - run: |
          for attempt in $(seq 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && exit 0
            sleep 2
          done
          echo "MinIO did not become ready" && exit 1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv tool install rust-just==1.58.0
      - run: uv sync --all-packages --locked
      - run: just test-minio

  pull-request:
    name: pull request rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Commits and the PR title are Conventional Commits, none empty
        env:
          BASE: origin/${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          uv run python tools/repo_check.py --commits "$BASE..HEAD"
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          uv run python tools/repo_check.py --commit-msg "$RUNNER_TEMP/title"
      - name: One work-log entry, no docs drift, accepted ADRs unchanged
        env:
          BASE: origin/${{ github.base_ref }}
          DRIFT: ${{ contains(github.event.pull_request.labels.*.name, 'docs-unaffected') && '--allow-drift' || '' }}
        run: uv run python tools/docs_check.py --base "$BASE" $DRIFT
