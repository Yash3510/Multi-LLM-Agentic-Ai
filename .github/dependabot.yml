# Weekly, grouped update PRs. They go through every check like any other change.
# The npm ecosystem is added with apps/web. Updates target the 4CE trunk, 4ce-core.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: 4ce-core
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: 4ce-core
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
