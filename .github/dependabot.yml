# Weekly, grouped update PRs. They go through every check like any other change.
# The npm ecosystem is added with apps/web. Updates target the 4CE trunk, 4ce-core, with
# Conventional Commit titles ("chore(deps): ..."); the reviewer adds the work-log entry.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: 4ce-core
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: 4ce-core
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
