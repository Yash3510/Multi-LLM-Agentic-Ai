[project]
name = "fource-identity"
version = "0.1.0"
description = "Users, passwords, sign-in tokens, lockout and roles."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fource-common",
    "fource-db",
    "fource-ledger",
    "pyjwt[crypto]>=2.15.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fource.identity"

[tool.uv.sources]
fource-common = { workspace = true }
fource-db = { workspace = true }
fource-ledger = { workspace = true }
