[project]
name = "fource-live"
version = "0.1.0"
description = "Live, short-lived shared state: events, cache, locks and rate limits, on Redis or in this process."
requires-python = ">=3.12"
dependencies = [
    "fource-common",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fource.live"

[tool.uv.sources]
fource-common = { workspace = true }
