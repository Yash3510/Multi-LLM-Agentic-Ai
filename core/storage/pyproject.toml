[project]
name = "fource-storage"
version = "0.1.0"
description = "Files per organisation: the storage interface, its local and S3 adapters, and their records."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "fource-common",
    "fource-db",
    "fource-jobs",
    "fource-ledger",
    "sqlalchemy[asyncio]>=2.1.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fource.storage"

[tool.uv.sources]
fource-common = { workspace = true }
fource-db = { workspace = true }
fource-jobs = { workspace = true }
fource-ledger = { workspace = true }
