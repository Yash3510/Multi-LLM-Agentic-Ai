[project]
name = "fource-common"
version = "0.1.0"
description = "Shared building blocks for every 4CE core package: typed settings."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fource.common"
